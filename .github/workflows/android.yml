name: Android CI

on:
  push:
    branches: [ main, feat/v0.5-privacy-reliability ]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
      - name: Install Android API 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Run standalone Probe unit tests
        run: gradle :probe:testTargetDebugUnitTest :probe:testControl1DebugUnitTest :probe:testControl2DebugUnitTest :probe:testControl3DebugUnitTest --stacktrace
      - name: Compile Macrobenchmark suite
        run: gradle :app:assembleBenchmark :benchmark:assembleBenchmark --stacktrace
      - name: Build debug APK and independent Probe variants
        run: gradle :app:assembleDebug :probe:assembleDebug --stacktrace
      - name: Generate and verify Probe APK SHA256 manifest
        run: |
          python3 tools/g09_device_gate.py manifest --apk-root probe/build/outputs/apk --revision "${{ github.sha }}" --output probe/build/outputs/apk/probe-build-manifest.json
          python3 tools/g09_device_gate.py verify-manifest --apk-root probe/build/outputs/apk --manifest probe/build/outputs/apk/probe-build-manifest.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone Probe APKs
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-Probe-four-variants-${{ github.sha }}
          path: |
            probe/build/outputs/apk/*/debug/*.apk
            probe/build/outputs/apk/probe-build-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify Probe report analyzer
        run: python3 -m unittest discover -s tools/tests -v
